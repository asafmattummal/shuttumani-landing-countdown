<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuttumani Landing Countdown</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
            radial-gradient(circle at center, #202020 0%, #0b0b0b 48%, #000 100%);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: min(1100px, 94vw);
        text-align: center;
        padding: 30px 10px;
    }

    .title {
        font-size: clamp(2.2rem, 7vw, 6.5rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1.05;
        text-transform: uppercase;
        text-shadow: 0 0 25px rgba(255,255,255,0.15);
    }

    .on {
        margin: 24px 0 8px;
        font-size: clamp(1rem, 2vw, 1.4rem);
        letter-spacing: 0.25em;
        text-transform: lowercase;
        opacity: 0.65;
    }

    .date {
        font-size: clamp(1.1rem, 2.5vw, 1.8rem);
        letter-spacing: 0.08em;
        opacity: 0.9;
    }

    .countdown {
        margin-top: 55px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(10px, 3vw, 35px);
    }

    .unit {
        min-width: 0;
    }

    .number {
        font-variant-numeric: tabular-nums;
        font-size: clamp(2.8rem, 8vw, 7rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.03em;
    }

    .label {
        margin-top: 14px;
        font-size: clamp(0.65rem, 1.5vw, 1rem);
        letter-spacing: 0.3em;
        opacity: 0.55;
    }

    .remaining {
        margin-top: 35px;
        font-size: clamp(0.75rem, 1.7vw, 1rem);
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0.5;
    }

    .finished {
        font-size: clamp(2rem, 6vw, 5rem);
        font-weight: 700;
        letter-spacing: 0.08em;
    }

    @media (max-width: 600px) {
        .countdown {
            gap: 8px;
            margin-top: 40px;
        }

        .number {
            font-size: clamp(2rem, 12vw, 4rem);
        }

        .label {
            letter-spacing: 0.15em;
        }
    }
</style>
</head>

<body>
<div class="container">
    <div class="title">SHUTTUMANI LANDING</div>

    <div class="on">on</div>
    <div class="date">31-Aug-2026, 6:15 AM IST</div>

    <div id="countdown" class="countdown">
        <div class="unit">
            <div id="days" class="number">00</div>
            <div class="label">DAYS</div>
        </div>
        <div class="unit">
            <div id="hours" class="number">00</div>
            <div class="label">HOURS</div>
        </div>
        <div class="unit">
            <div id="minutes" class="number">00</div>
            <div class="label">MINUTES</div>
        </div>
        <div class="unit">
            <div id="seconds" class="number">00</div>
            <div class="label">SECONDS</div>
        </div>
    </div>

    <div class="remaining">remaining</div>
</div>

<script>
    // 31 August 2026, 6:15 AM IST (UTC+05:30)
    const targetTime = new Date("2026-08-31T06:15:00+05:30").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const countdownEl = document.getElementById("countdown");

    function updateCountdown() {
        const now = Date.now();
        let difference = targetTime - now;

        if (difference <= 0) {
            countdownEl.innerHTML = '<div class="finished" style="grid-column: 1 / -1;">SHUTTUMANI HAS LANDED</div>';
            return;
        }

        const totalSeconds = Math.floor(difference / 1000);

        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        daysEl.textContent = String(days).padStart(2, "0");
        hoursEl.textContent = String(hours).padStart(2, "0");
        minutesEl.textContent = String(minutes).padStart(2, "0");
        secondsEl.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
</body>
</html>
